name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: "29.0.14206865"
  BUILD_DIR: "${{ github.workspace }}/.ci/build-cache"
  BIN_DIR: "${{ github.workspace }}/.ci/bin"
  VENV_DIR: "${{ github.workspace }}/.ci/venv"

jobs:
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git zip unzip openjdk-17-jdk python3-venv python3-dev file
          java -version
          cmake --version

      - name: Prepare Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?GitHub runner must provide ANDROID_SDK_ROOT}"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          test -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR"
          python3 -m venv "$VENV_DIR"
          test -x "$VENV_DIR/bin/python"
          test -x "$VENV_DIR/bin/pip"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip setuptools wheel
          "$VENV_DIR/bin/python" -m pip install "buildozer==1.6.0" "Cython==0.29.33"
          "$VENV_DIR/bin/buildozer" --version

      - name: Run source tests
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" -m pytest -q

      - name: Build pinned llama.cpp Android server
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/build_llama_server_android.sh
          ./tools/build_llama_server_android.sh
          test -s android_native/arm64-v8a/llama-server.bin
          file android_native/arm64-v8a/llama-server.bin
          readelf -h android_native/arm64-v8a/llama-server.bin | tee .ci/native-elf.txt
          grep -q 'Class:.*ELF64' .ci/native-elf.txt
          grep -q 'Machine:.*AArch64' .ci/native-elf.txt
          sha256sum android_native/arm64-v8a/llama-server.bin | tee .ci/native-sha256.txt
          ./android_native/arm64-v8a/llama-server.bin --version | tee .ci/native-version.txt

      - name: Build Android debug APK
        shell: bash
        env:
          BUILDOZER_BUILD_DIR: "${{ env.BUILD_DIR }}"
          BUILDOZER_BIN_DIR: "${{ env.BIN_DIR }}"
          BUILDOZER_WARN_ON_ROOT: "0"
          P4A_NO_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          rm -rf "$BUILD_DIR" "$BIN_DIR"
          mkdir -p "$BUILD_DIR" "$BIN_DIR"
          "$VENV_DIR/bin/buildozer" -v android debug
          APK="$(find "$BIN_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify APK metadata and provenance
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APK:-}"
          test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee .ci/apk-badging.txt
          grep -q "package: name='org.rpgengine'" .ci/apk-badging.txt
          sha256sum "$APK" | tee .ci/apk-sha256.txt
          {
            echo "git_commit=$GITHUB_SHA"
            echo "runner=ubuntu-24.04"
            echo "ndk=$NDK_VERSION"
            echo "buildozer=1.6.0"
            cat .ci/native-sha256.txt
            cat .ci/native-version.txt
            cat .ci/apk-sha256.txt
          } > .ci/android-build-provenance.txt

      - name: Upload APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpg-engine-v1.1-android-debug
          path: |
            .ci/bin/*.apk
            .ci/native-elf.txt
            .ci/native-sha256.txt
            .ci/native-version.txt
            .ci/apk-badging.txt
            .ci/apk-sha256.txt
            .ci/android-build-provenance.txt
          if-no-files-found: error
