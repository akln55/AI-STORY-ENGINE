name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: "29.0.14206865"
      BUILD_DIR: "${{ github.workspace }}/.ci/build-cache"
      BIN_DIR: "${{ github.workspace }}/.ci/bin"
      VENV_DIR: "${{ github.workspace }}/.ci/venv"
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git zip unzip \
            openjdk-17-jdk python3-venv python3-dev file \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev libltdl-dev autopoint gettext
          java -version
          cmake --version
          python3 --version

      - name: Prepare Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK root is not configured on the runner."; exit 1; }
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR"
          python3 -m venv "$VENV_DIR"
          test -x "$VENV_DIR/bin/python"
          test -x "$VENV_DIR/bin/pip"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip setuptools wheel
          "$VENV_DIR/bin/python" -m pip install "buildozer==1.6.0" "Cython==0.29.33" "pytest==8.4.2"
          "$VENV_DIR/bin/buildozer" --version

      - name: Run source tests
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" -m pytest -q tests

      - name: Build pinned llama.cpp Android server
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/build_llama_server_android.sh
          ./tools/build_llama_server_android.sh
          test -s android_native/arm64-v8a/llama-server.bin
          file android_native/arm64-v8a/llama-server.bin
          readelf -h android_native/arm64-v8a/llama-server.bin | tee .ci/native-elf.txt
          grep -q 'Class:.*ELF64' .ci/native-elf.txt
          grep -q 'Machine:.*AArch64' .ci/native-elf.txt
          grep -q '^llama.cpp tag=v0.6.0 commit=d81235049384534c167caea52b85a694f6103d14$' android_native/arm64-v8a/llama-server.bin.build-info
          sha256sum android_native/arm64-v8a/llama-server.bin | tee .ci/native-sha256.txt

      - name: Build Android debug APK
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          P4A_NO_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          source "$VENV_DIR/bin/activate"
          export PATH="$VENV_DIR/bin:$PATH"
          test "$VIRTUAL_ENV" = "$VENV_DIR"
          command -v cython
          cython --version
          command -v buildozer
          buildozer --version
          rm -rf "$BUILD_DIR" "$BIN_DIR"
          mkdir -p "$BUILD_DIR" "$BIN_DIR"
          buildozer -v android debug
          "$VENV_DIR/bin/python" tools/verify_android_staging.py --source-dir . --build-dir "$BUILD_DIR"
          APK="$(find "$BIN_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify APK metadata and provenance
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APK:-}"
          test -f "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee .ci/apk-badging.txt
          grep -q "package: name='org.rpgengine'" .ci/apk-badging.txt
          sha256sum "$APK" | tee .ci/apk-sha256.txt
          {
            echo "git_commit=$GITHUB_SHA"
            echo "runner=ubuntu-24.04"
            echo "python=$(python3 --version)"
            echo "ndk=$NDK_VERSION"
            echo "buildozer=1.6.0"
            echo "p4a_commit=58d21141f17c889bf8585f5665921d72028f8831"
            cat .ci/native-sha256.txt
            cat .ci/apk-sha256.txt
          } > .ci/android-build-provenance.txt

      - name: Upload APK and provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rpg-engine-v1.1.4-android-debug
          path: |
            ${{ env.BIN_DIR }}/*.apk
            .ci/native-elf.txt
            .ci/native-sha256.txt
            .ci/apk-badging.txt
            .ci/apk-sha256.txt
            .ci/android-build-provenance.txt
          if-no-files-found: error
