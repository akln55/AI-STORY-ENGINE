name: Test suite

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev
          python3 -m venv .ci/test-venv
          .ci/test-venv/bin/python -m pip install --upgrade pip setuptools wheel
          .ci/test-venv/bin/python -m pip install "pytest==8.4.2"

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          .ci/test-venv/bin/python -m pytest -q

      - name: Compile Python source
        shell: bash
        run: |
          set -euo pipefail
          .ci/test-venv/bin/python -m compileall -q .

      - name: Android readiness contract
        shell: bash
        run: |
          set -euo pipefail
          .ci/test-venv/bin/python tools/verify_android_readiness.py

      - name: Mutation smoke
        shell: bash
        run: |
          set -euo pipefail
          .ci/test-venv/bin/python tools/mutation_smoke.py
